services:
  - type: web
    name: zhelta-systems-portal-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: zhelta_systems_portal
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
